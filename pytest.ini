[pytest]
addopts = -m "not slow"
testpaths =
    kernel/tests
    frontends/tui/classic/tests
    frontends/web-local/tests
    frontends/zed/tests
    frontends/kvide/tests
    scripts/installer/tests
    scripts/tests
# The frontend implementations are flat modules outside the kernel package;
# the kernel puts them on sys.path itself, the tests do it here.
pythonpath = . frontends/tui/classic frontends/web-local frontends/zed scripts
norecursedirs =
    node_modules
    .git
    .venv
    venv
    build
    dist
    stress_runs
    user_test_workspace
    .agent-workspace
    __pycache__
    .pytest_cache
    workspace
    .idea
    .vscode
    jetbrains
markers =
    live_llm: live tests that call the configured FreeFlow LLM provider (opt-in via RUN_LIVE_LLM_TESTS=1)
    smoke: live-provider smoke tests (still require RUN_LIVE_LLM_TESTS=1)
    offline_smoke: fast credential-free checks for core routing, execution, persistence, and UI
    ui_e2e: credential-free outer-PTY terminal lifecycle tests
    slow: integration tests with real processes/PTYs (excluded by default; run all via -m "")
