[pytest]
testpaths = tests
norecursedirs =
    .git
    .venv
    venv
    build
    dist
    stress_runs
    user_test_workspace
    .agent-workspace
    __pycache__
    .pytest_cache
    workspace
    .idea
    .vscode
    jetbrains-plugin
markers =
    live_llm: live tests that call the configured FreeFlow LLM provider (opt-in via RUN_LIVE_LLM_TESTS=1)
    smoke: smoke tests - minimal subset for quick validation (1-2 cases per role)
