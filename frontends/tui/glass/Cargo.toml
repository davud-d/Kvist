[package]
name = "kvist-glass"
version = "0.1.0"
edition = "2024"
description = "Kvist's photographic terminal interface (prototype, kitty graphics protocol only)"
publish = false

[dependencies]
base64 = "0.23.1"
crossterm = "0.29.0"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
libc = "0.2.191"
ratatui = "0.30.2"
serde_json = "1.0.154"
unicode-width = "0.2.2"

# Image work (resize, blur, compose) runs every animation frame; an unoptimised
# build makes a debug run look broken rather than slow.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
