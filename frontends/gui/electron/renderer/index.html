<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: http://127.0.0.1:*; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Kvist</title>
    <link rel="icon" href="kvist-mark.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <!-- Icon rail -->
      <nav id="rail" class="rail" aria-label="Sections">
        <button id="rail-threads" class="rail-btn" type="button" data-nav="thread" title="Threads" aria-label="Threads" data-icon="home"></button>
        <button id="rail-skills" class="rail-btn" type="button" data-nav="skills" title="Skills" aria-label="Skills" data-icon="sparkle"></button>
        <button id="rail-memory" class="rail-btn" type="button" data-nav="memory" title="Memory" aria-label="Memory" data-icon="memory"></button>
        <span class="rail-sep"></span>
        <button id="rail-review" class="rail-btn" type="button" title="Review changes (Ctrl+Shift+D)" aria-label="Review changes" data-icon="review"></button>
        <button id="rail-commands" class="rail-btn" type="button" title="Commands (Ctrl+J)" aria-label="Commands" data-icon="terminal"></button>
        <span class="grow"></span>
        <button id="rail-settings" class="rail-btn" type="button" data-nav="settings" title="Settings (Ctrl+,)" aria-label="Settings" data-icon="gear"></button>
      </nav>

      <!-- Side panel: threads, or the settings sections -->
      <aside id="panel" class="panel" aria-label="Navigation">
        <div id="panel-threads" class="panel-body">
          <div class="panel-head">
            <button id="workspace-switch" class="panel-title" type="button" aria-label="Switch project"><span>Kvist</span><span data-icon="chevronDown"></span></button>
            <span class="grow"></span>
            <button id="nav-search" class="icon-btn" type="button" title="Search (Ctrl+K)" aria-label="Search" data-icon="search"></button>
          </div>
          <button id="nav-new" class="panel-row" type="button" title="New thread (Ctrl+N)"><span data-icon="compose"></span><span>New thread</span></button>
          <div class="panel-scroll">
            <div class="panel-label"><span>Projects</span><button id="add-project" class="icon-btn small" type="button" title="Add a project folder" aria-label="Add a project folder" data-icon="folderPlus"></button></div>
            <div id="projects" class="projects"></div>
            <div class="panel-label"><span>Recent</span></div>
            <div id="recent" class="recent"></div>
          </div>
        </div>
        <div id="panel-settings" class="panel-body is-hidden">
          <button id="settings-back" class="panel-row back" type="button"><span data-icon="arrowLeft"></span><span>Back to app</span></button>
          <h2 class="panel-heading">Settings</h2>
          <label class="search-field"><span data-icon="search"></span><input id="settings-search" type="search" placeholder="Search" aria-label="Search settings" /></label>
          <nav id="settings-nav" class="settings-nav" aria-label="Settings sections"></nav>
        </div>
      </aside>

      <!-- Main column -->
      <main class="main">
        <header id="topbar" class="topbar">
          <button id="panel-toggle" class="icon-btn" type="button" aria-label="Toggle the side panel" title="Ctrl+B" data-icon="sidebar"></button>
          <div class="title-block">
            <span id="thread-title-icon" class="is-hidden" data-icon="folder"></span>
            <h1 id="thread-title" class="topbar-title">New thread</h1>
            <span id="thread-project" class="thread-project"></span>
          </div>
          <div id="topbar-actions" class="topbar-actions">
            <button id="open-folder" class="icon-btn" type="button" title="Open the project folder" aria-label="Open the project folder" data-icon="folder"></button>
            <button id="commit-btn" class="icon-btn" type="button" title="Commit changes" aria-label="Commit changes" data-icon="branch" disabled></button>
          </div>
        </header>

        <div class="content">
          <div class="center">
            <section id="thread-view" class="thread-view">
              <div id="timeline" class="timeline">
                <div id="timeline-inner" class="timeline-inner"></div>
              </div>
              <div id="empty" class="empty"></div>
              <button id="jump" class="jump is-hidden" type="button" aria-label="Jump to latest" data-icon="arrowDown"></button>

              <div id="dock" class="dock">
                <div id="setup-bar" class="bar is-warn is-hidden">
                  <span data-icon="key"></span>
                  <span>Connect a model provider to start working.</span>
                  <button id="setup-open" class="btn small primary" type="button">Open settings</button>
                </div>
                <div id="resume-bar" class="bar is-hidden"></div>
                <div id="request-host" class="request-host is-hidden"></div>
                <div id="closed-bar" class="bar is-closed is-hidden"></div>
                <div class="composer-wrap">
                  <div id="suggest" class="suggest is-hidden" role="listbox"></div>
                  <div id="strip" class="strip"></div>
                  <form id="composer" class="composer" autocomplete="off">
                    <div id="attachments" class="attachments is-hidden"></div>
                    <textarea id="prompt" rows="1" spellcheck="true" aria-label="Message" placeholder="Ask Kvist anything"></textarea>
                    <div class="composer-row">
                      <div class="composer-left">
                        <button id="attach-btn" class="chip icon-only" type="button" aria-label="Attach" data-icon="plus"></button>
                        <button id="approval-chip" class="chip" type="button"></button>
                        <button id="role-chip" class="chip" type="button"></button>
                      </div>
                      <div class="composer-right">
                        <span id="context-meter" class="meter is-hidden"></span>
                        <button id="model-chip" class="chip" type="button"></button>
                        <button id="send-btn" class="send" type="submit"></button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            </section>

            <section id="page" class="page is-hidden"></section>

            <section id="drawer" class="drawer" aria-label="Commands">
              <div class="drawer-head">
                <span data-icon="terminal"></span>
                <span class="drawer-title">Commands</span>
                <button id="drawer-close" class="icon-btn small" type="button" aria-label="Close" data-icon="x"></button>
              </div>
              <div id="drawer-body" class="drawer-body"></div>
            </section>
          </div>

          <aside id="review" class="review" aria-label="Review">
            <div id="review-resize" class="resize-handle" role="separator" aria-orientation="vertical"></div>
            <div class="review-inner">
              <div class="review-head">
                <div class="tabs">
                  <button class="tab" type="button" data-tab="agent">Agent changes</button>
                  <button class="tab" type="button" data-tab="git">Working tree</button>
                </div>
                <button id="review-close" class="icon-btn small" type="button" aria-label="Close" data-icon="x"></button>
              </div>
              <div id="review-actions" class="review-actions"></div>
              <div id="review-body" class="review-body"></div>
            </div>
          </aside>
        </div>
      </main>
    </div>

    <div id="modals"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script src="../src/protocol-state.js"></script>
    <script src="js/util.js"></script>
    <script src="js/providers.js"></script>
    <script src="js/chrome.js"></script>
    <script src="js/diff.js"></script>
    <script src="js/thread.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/composer.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/panels.js"></script>
    <script src="js/pages.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
