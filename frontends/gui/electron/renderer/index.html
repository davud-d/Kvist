<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: http://127.0.0.1:*; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Kvist</title>
    <link rel="icon" href="kvist-mark.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar" aria-label="Navigation">
        <div class="side-head">
          <img class="brand-mark" src="kvist-mark.svg" alt="" />
          <span class="brand-name">Kvist</span>
          <button id="sidebar-toggle" class="icon-btn" type="button" aria-label="Hide sidebar" title="Ctrl+B">
            <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></span>
          </button>
        </div>
        <nav class="side-nav">
          <button id="nav-new" class="nav-item" type="button"><span class="nav-icon" data-icon="compose"></span><span class="nav-label" data-i18n="New thread|Новый тред"></span><kbd>Ctrl+N</kbd></button>
          <button id="nav-search" class="nav-item" type="button"><span class="nav-icon" data-icon="search"></span><span class="nav-label" data-i18n="Search|Поиск"></span><kbd>Ctrl+K</kbd></button>
          <button id="nav-skills" class="nav-item" type="button" data-nav="skills"><span class="nav-icon" data-icon="sparkle"></span><span class="nav-label" data-i18n="Skills|Навыки"></span></button>
          <button id="nav-memory" class="nav-item" type="button" data-nav="memory"><span class="nav-icon" data-icon="memory"></span><span class="nav-label" data-i18n="Memory|Память"></span></button>
        </nav>
        <div class="side-section">
          <span data-i18n="Projects|Проекты"></span>
          <button id="add-project" class="icon-btn small" type="button" data-i18n-title="Add a project folder|Добавить папку проекта" data-icon="folderPlus"></button>
        </div>
        <div id="projects" class="projects"></div>
        <div class="side-foot">
          <button id="nav-settings" class="nav-item" type="button" data-nav="settings"><span class="nav-icon" data-icon="sliders"></span><span class="nav-label" data-i18n="Settings|Настройки"></span><kbd>Ctrl+,</kbd></button>
        </div>
      </aside>

      <!-- Main column -->
      <main class="main">
        <header id="topbar" class="topbar">
          <button id="sidebar-open" class="icon-btn only-collapsed" type="button" aria-label="Show sidebar" title="Ctrl+B" data-icon="sidebar"></button>
          <div class="title-block">
            <h1 id="thread-title" class="topbar-title">New thread</h1>
            <span id="thread-project" class="thread-project"></span>
          </div>
          <div id="topbar-actions" class="topbar-actions">
            <button id="open-folder" class="btn small ghost" type="button" data-i18n-title="Open the project folder|Открыть папку проекта"><span data-icon="folder"></span><span data-i18n="Open|Открыть"></span></button>
            <button id="commit-btn" class="btn small ghost" type="button" disabled><span data-icon="branch"></span><span data-i18n="Commit|Коммит"></span></button>
            <button id="drawer-toggle" class="btn small ghost icon-only" type="button" data-i18n-title="Commands (Ctrl+J)|Команды (Ctrl+J)" data-icon="terminal"></button>
            <button id="review-toggle" class="btn small ghost" type="button" data-i18n-title="Review changes (Ctrl+Shift+D)|Изменения (Ctrl+Shift+D)"><span data-icon="review"></span><span data-i18n="Review|Изменения"></span><span class="review-counts"></span></button>
          </div>
        </header>

        <div class="content">
          <div class="center">
            <section id="thread-view" class="thread-view">
              <div id="timeline" class="timeline">
                <div id="timeline-inner" class="timeline-inner"></div>
              </div>
              <div id="empty" class="empty"></div>
              <button id="jump" class="jump is-hidden" type="button" aria-label="Jump to latest"><span data-icon="arrowDown"></span></button>

              <div id="dock" class="dock">
                <div id="setup-bar" class="bar is-warn is-hidden">
                  <span data-icon="key"></span>
                  <span data-i18n="Connect a model provider to start working.|Подключи провайдера моделей, чтобы начать."></span>
                  <button id="setup-open" class="btn small primary" type="button" data-i18n="Open settings|Открыть настройки"></button>
                </div>
                <div id="resume-bar" class="bar is-hidden"></div>
                <div id="request-host" class="request-host is-hidden"></div>
                <div id="closed-bar" class="bar is-closed is-hidden"></div>
                <div class="composer-wrap">
                  <div id="suggest" class="suggest is-hidden" role="listbox"></div>
                  <form id="composer" class="composer" autocomplete="off">
                    <div id="attachments" class="attachments is-hidden"></div>
                    <textarea id="prompt" rows="1" spellcheck="true" aria-label="Message"></textarea>
                    <div class="composer-row">
                      <div class="composer-left">
                        <button id="attach-btn" class="chip icon-only" type="button" aria-label="Attach" data-icon="plus"></button>
                        <button id="approval-chip" class="chip" type="button"></button>
                        <button id="role-chip" class="chip" type="button"></button>
                      </div>
                      <div class="composer-right">
                        <span id="context-meter" class="meter is-hidden"></span>
                        <button id="model-chip" class="chip" type="button"></button>
                        <button id="send-btn" class="send" type="submit"></button>
                      </div>
                    </div>
                  </form>
                  <div id="envbar" class="envbar"></div>
                </div>
              </div>
            </section>

            <section id="page" class="page is-hidden"></section>

            <section id="drawer" class="drawer" aria-label="Commands">
              <div class="drawer-head">
                <span data-icon="terminal"></span>
                <span class="drawer-title" data-i18n="Commands|Команды"></span>
                <button id="drawer-close" class="icon-btn small" type="button" aria-label="Close" data-icon="x"></button>
              </div>
              <div id="drawer-body" class="drawer-body"></div>
            </section>
          </div>

          <aside id="review" class="review" aria-label="Review">
            <div id="review-resize" class="resize-handle" role="separator" aria-orientation="vertical"></div>
            <div class="review-inner">
              <div class="review-head">
                <div class="tabs">
                  <button class="tab" type="button" data-tab="agent" data-i18n="Agent changes|Правки агента"></button>
                  <button class="tab" type="button" data-tab="git" data-i18n="Working tree|Рабочее дерево"></button>
                </div>
                <button id="review-close" class="icon-btn small" type="button" aria-label="Close" data-icon="x"></button>
              </div>
              <div id="review-actions" class="review-actions"></div>
              <div id="review-body" class="review-body"></div>
            </div>
          </aside>
        </div>
      </main>
    </div>

    <div id="modals"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script src="../src/protocol-state.js"></script>
    <script src="js/util.js"></script>
    <script src="js/chrome.js"></script>
    <script src="js/diff.js"></script>
    <script src="js/thread.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/composer.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/panels.js"></script>
    <script src="js/pages.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
