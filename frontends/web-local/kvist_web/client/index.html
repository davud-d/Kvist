<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="kvist-csrf" content="{{KVIST_CSRF}}"><title>Kvist</title>
  <link rel="icon" href="/assets/kvist-mark.svg"><link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div id="startup" class="startup" role="status" aria-live="polite"><img src="/assets/kvist-mark.svg" alt="" width="36" height="36"><div><strong>Kvist</strong><p id="startup-stage">Restoring your workspaces…</p><button id="retry-startup" hidden>Try again</button></div></div>
  <div id="app" class="app" hidden>
    <button id="sidebar-scrim" class="sidebar-scrim" aria-label="Close sidebar" tabindex="-1"></button>
    <aside id="sidebar" class="sidebar" aria-label="Sessions and workspaces">
      <header class="sidebar-head"><a class="brand" href="/" aria-label="Kvist home"><img src="/assets/kvist-mark.svg" alt="" width="25" height="25">Kvist</a><button id="search-button" class="icon-button" aria-label="Search sessions and workspaces" title="Quick open, Ctrl/Cmd+P" data-icon="search"></button></header>
      <button id="new-session" class="new-session"><span data-icon="plus"></span>New session</button>
      <button id="inbox-button" class="inbox-button"><span data-icon="inbox"></span><span>Inbox</span><span id="inbox-count" class="badge">0</span></button>
      <nav id="navigation" class="navigation" aria-label="Sessions"></nav>
      <footer class="sidebar-foot"><button id="add-workspace" class="quiet-button"><span data-icon="folder-plus"></span>Add workspace</button><button id="settings-button" class="quiet-button"><span data-icon="settings"></span>Settings</button><button id="commands-button" class="quiet-button command-hint"><kbd>⌘ / Ctrl K</kbd>Commands</button></footer>
    </aside>
    <main class="main">
      <header class="session-head"><button id="toggle-sidebar" class="icon-button" aria-label="Toggle sidebar" aria-expanded="true" data-icon="sidebar"></button><div class="session-identity"><h1 id="session-title">New session</h1><p><span id="session-path">Choose a workspace to begin</span><span id="session-server" hidden></span></p></div><div class="head-actions"><button data-view="files" aria-selected="false">Files</button><button data-view="diff" aria-selected="false">Diff</button><button data-view="terminal" aria-selected="false">Terminal</button><button id="more-tools" class="icon-button" aria-label="More session tools" data-icon="more"></button></div></header>
      <div class="conversation-wrap"><section id="conversation" class="conversation" aria-label="Conversation" tabindex="0"></section><section id="empty-state" class="empty-state"><img src="/assets/kvist-mark.svg" alt="" width="38" height="38"><h2>Start a conversation</h2><p>Give Kvist a task in your workspace.</p></section><div id="history-status" class="history-status" role="status" hidden></div><button id="jump-latest" class="jump-latest" hidden>↓ Latest messages</button></div>
      <section id="pending-input" class="pending-input" aria-label="Agent needs your input" hidden></section>
      <div class="composer-area"><form id="composer" class="composer"><label class="sr-only" for="prompt">Message Kvist</label><textarea id="prompt" rows="2" placeholder="Message Kvist…" spellcheck="false"></textarea><div class="composer-foot"><div class="composer-controls"></div><div class="composer-controls"><button type="button" id="model-selector" class="model-button" aria-haspopup="dialog"><span id="model-label">Model details</span><span data-icon="chevron"></span></button><button type="button" id="stop-agent" class="stop-button" hidden><span data-icon="stop"></span>Stop</button><button id="send-button" type="submit" class="send-button" aria-label="Send message" title="Send, Ctrl+Enter" data-icon="arrow-up" disabled aria-disabled="true"></button></div></div></form>
      <p class="composer-hint">Ctrl+Enter to send</p>
      <div class="status-line"><button id="context-button" title="Show context usage" hidden></button><span id="connection-label" class="status-item" role="status" aria-live="polite" hidden></span><span id="agent-state" class="status-item" role="status" aria-live="polite" hidden></span></div></div>
    </main>
  </div>
  <div id="workspace-view" class="overlay" hidden><section class="workspace-view" role="dialog" aria-modal="true" aria-label="Session tools"><header class="view-header"><div class="view-tabs" role="tablist" aria-label="Session tools"><button role="tab" data-tab="files">Files</button><button role="tab" data-tab="diff">Diff</button><button role="tab" data-tab="terminal">Terminal</button><button role="tab" data-tab="activity">Activity</button><button role="tab" data-tab="context">Context</button><button role="tab" data-tab="usage">Usage</button></div><button id="close-view" class="icon-button" aria-label="Close session tools" data-icon="close"></button></header><div id="inspector-content" class="view-content" role="tabpanel" tabindex="0"></div></section></div>
  <div id="palette" class="overlay" hidden><section class="palette" role="dialog" aria-modal="true" aria-label="Command palette"><div class="palette-search"><span data-icon="search"></span><input id="palette-input" aria-label="Search commands, sessions and workspaces" autocomplete="off" placeholder="Type a command…"><button id="close-palette" class="icon-button" aria-label="Close command palette" data-icon="close"></button></div><div id="palette-results" class="palette-results"></div><footer><span>↑ ↓ navigate</span><span>Enter open, Esc close</span></footer></section></div>
  <div id="modal" class="overlay" hidden></div><div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/assets/app.js"></script>
</body></html>
