[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvist"
version = "0.1.0b1"
description = "Local, terminal-based coding agent"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "python-dotenv==1.0.1",
    "rich==14.1.0",
    "tiktoken",
    "freeflow-llm==0.1.3",
    "anthropic>=0.30.0",
    "prompt_toolkit>=3.0",
    "distro",
    "pywin32; sys_platform == 'win32'",
    # ACP (kvist --acp). The upper bound exists because acp_frontend patches the
    # SDK router to add the stable but unrouted `session/delete`; that patch has
    # been verified against 0.12.x only. A 0.13 that routes it natively just
    # needs the bound relaxed (the patch is a no-op then).
    "agent-client-protocol>=0.12.1,<0.13",
]

[project.scripts]
kvist = "main:main"

[tool.setuptools]
# Two kinds of thing the app imports: the `providers` package directory, and
# the flat top-level modules in py-modules below. `packages` also names the
# data directories the code reads at runtime by path relative to __file__
# (prompts/, themes/, assets/, dist-ui/) as namespace packages — no
# __init__.py — so setuptools installs them next to the flat modules in
# site-packages, at the same relative paths the loaders expect. py-modules is
# explicit because setuptools has no automatic "find" for top-level modules;
# it mirrors kvist.spec's local_hiddenimports, minus the dev-only entry
# scripts that one also excludes (run_task, package_script).
packages = [
    "providers",
    "prompts",
    "prompts.system",
    "prompts.styles",
    "prompts.styles.agents",
    "prompts.styles.chat",
    "themes",
    "assets",
    "dist-ui",
]
py-modules = [
    "acp_events",
    "acp_frontend",
    "acp_stdio",
    "action_result",
    "agent",
    "agent_context",
    "agent_logging",
    "agent_model",
    "agent_planner",
    "agent_runtime",
    "agent_state",
    "agent_web",
    "anymodel_onboarding",
    "api_settings",
    "approvals",
    "banner",
    "banner_frames",
    "bug_report",
    "call_labels",
    "change_journal",
    "command_policy",
    "commit_message",
    "completion",
    "config_info",
    "context_budget",
    "context_utils",
    "core_manifest",
    "custom_provider",
    "deps",
    "durable_json",
    "env_utils",
    "event_session",
    "event_stdio",
    "event_stream_ui",
    "executor",
    "frontend_protocol",
    "frontends",
    "import_resolver",
    "interactive_screen",
    "language_policy",
    "language_utils",
    "llm_clients",
    "main",
    "native_tools",
    "parser",
    "performance_logger",
    "permission_policy",
    "process_tree",
    "protocol",
    "reasoning_effort",
    "redaction",
    "render_throttle",
    "role_router",
    "sandbox",
    "secret_paths",
    "session_events",
    "session_store",
    "session_titler",
    "slash_commands",
    "splash",
    "system_context",
    "terminal",
    "terminal_banner",
    "terminal_image",
    "theme",
    "ui",
    "user_config",
    "version",
]

[tool.setuptools.package-data]
"prompts.system" = ["*.txt"]
"prompts.styles.agents" = ["*.txt"]
"prompts.styles.chat" = ["*.txt"]
themes = ["*.json"]
assets = ["*.png"]
"dist-ui" = ["*.mjs"]
