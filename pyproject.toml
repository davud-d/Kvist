[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvist"
version = "0.1.0b1"
description = "Local, terminal-based coding agent"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "python-dotenv==1.0.1",
    "rich==14.1.0",
    "tiktoken",
    "freeflow-llm==0.1.3",
    "anthropic>=0.30.0",
    "prompt_toolkit>=3.0",
    "distro",
    "pywin32; sys_platform == 'win32'",
    # ACP (kvist --acp). The upper bound exists because acp_frontend patches the
    # SDK router to add the stable but unrouted `session/delete`; that patch has
    # been verified against 0.12.x only. A 0.13 that routes it natively just
    # needs the bound relaxed (the patch is a no-op then).
    "agent-client-protocol>=0.12.1,<0.13",
]

[project.scripts]
kvist = "kernel.main:main"

[tool.setuptools]
# The core is the `kernel` package. Everything else here is installed at the
# same path relative to site-packages as it has relative to the repository,
# because the code finds it that way: the data directories read by path from
# __file__ (prompts, themes, the classic terminal's assets, the Ink bundle),
# and the classic terminal and Zed frontend, whose flat modules kernel/__init__
# puts on sys.path. Those are namespace packages (no __init__.py); setuptools
# installs only the files directly inside each listed directory, so tests/
# subdirectories stay out. kernel/tests/test_pyproject_modules.py checks this list.
packages = [
    "kernel",
    "kernel.providers",
    "kernel.prompts",
    "kernel.prompts.system",
    "kernel.prompts.styles",
    "kernel.prompts.styles.agents",
    "kernel.prompts.styles.chat",
    "kernel.themes",
    "frontends.tui.classic",
    "frontends.tui.classic.assets",
    "frontends.tui.ink.dist-ui",
    "frontends.zed",
]

[tool.setuptools.package-data]
"kernel.prompts.system" = ["*.txt"]
"kernel.prompts.styles" = ["*.txt"]
"kernel.prompts.styles.agents" = ["*.txt"]
"kernel.prompts.styles.chat" = ["*.txt"]
"kernel.themes" = ["*.json"]
"frontends.tui.classic.assets" = ["*.png"]
"frontends.tui.ink.dist-ui" = ["*.mjs"]
