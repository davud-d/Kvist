[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvist"
version = "0.1.0b1"
description = "Local, terminal-based coding agent"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0.0",
    "PyJWT[crypto]>=2.10.1",
    "Pillow>=10.4",
    "python-dotenv==1.0.1",
    "rich==14.1.0",
    "tiktoken",
    "freeflow-llm==0.1.3",
    "anthropic>=0.30.0",
    "prompt_toolkit>=3.0",
    "distro",
    "pywin32; sys_platform == 'win32'",
    # ACP (kvist --acp). The upper bound exists because acp_frontend patches the
    # SDK router to add the stable but unrouted `session/delete`; that patch has
    # been verified against 0.12.x only. A 0.13 that routes it natively just
    # needs the bound relaxed (the patch is a no-op then).
    "agent-client-protocol>=0.12.1,<0.13",
    "paramiko>=3.4.0",
    "keyring>=25.0.0",
]

[project.scripts]
kvist = "kernel.main:main"
kvist-web = "kvist_web.cli:main"
kvist-web-bridge = "kvist_web.bridge_cli:main"

[tool.setuptools]
# The core is the `kernel` package. Everything else here is installed at the
# same path relative to site-packages as it has relative to the repository,
# because the code finds it that way: the data directories read by path from
# __file__ (prompts, themes, the classic terminal's assets, the Ink bundle),
# and the classic terminal and Zed frontend, whose flat modules kernel/__init__
# puts on sys.path. Those are namespace packages (no __init__.py); setuptools
# installs only the files directly inside each listed directory, so tests/
# subdirectories stay out. kernel/tests/test_pyproject_modules.py checks this list.
packages = [
    "kernel",
    "kernel.providers",
    "kernel.prompts",
    "kernel.prompts.system",
    "kernel.prompts.styles",
    "kernel.prompts.styles.agents",
    "kernel.prompts.styles.chat",
    "kernel.themes",
    "kernel.plugins",
    "kernel.plugins.runner",
    "kernel.skills_bundled.browser",
    "kernel.skills_bundled.test_runner",
    "kernel.skills_bundled.documents",
    "kernel.skills_bundled.code_nav",
    "kernel.skills_bundled.project_overview",
    "kernel.skills_bundled.static_checks",
    "kernel.skills_bundled.debugging",
    "frontends.gui.electron.renderer",
    "frontends.tui.classic",
    "frontends.tui.classic.assets",
    "frontends.tui.ink.dist-ui",
    "frontends.zed",
    "kvist_web",
    "kvist_web.runtime",
    "kvist_web.ssh",
    "kvist_web.bridge",
    "kvist_web.installers",
]

[tool.setuptools.package-dir]
kvist_web = "frontends/web-local/kvist_web"

[tool.setuptools.package-data]
# A bundled skill is installed as a package folder (kvist --skill-op install
# --skill-path bundled:<id>), so its manifest, instructions and own tests ship too.
"kernel.skills_bundled.browser" = ["manifest.json", "SKILL.md"]
"kernel.skills_bundled.test_runner" = ["manifest.json", "SKILL.md", "tests/*.py", "tests/*.json"]
"kernel.skills_bundled.documents" = ["manifest.json", "SKILL.md", "tests/*.py", "tests/*.json"]
"kernel.skills_bundled.code_nav" = ["manifest.json", "SKILL.md", "tests/*.py", "tests/*.json"]
"kernel.skills_bundled.project_overview" = ["manifest.json", "SKILL.md", "tests/*.py", "tests/*.json"]
"kernel.skills_bundled.static_checks" = ["manifest.json", "SKILL.md", "tests/*.py", "tests/*.json"]
"kernel.skills_bundled.debugging" = ["manifest.json", "SKILL.md"]
"frontends.gui.electron.renderer" = ["image-attachments.js"]
kvist_web = [
    "client/index.html",
    "client/app.js",
    "client/styles.css",
    "client/utils/api.js",
    "client/state/store.js",
    "client/features/navigation.js",
    "client/features/session.js",
    "client/features/palette.js",
    "client/features/connections.js",
    "client/features/configuration.js",
    "client/features/views.js",
    "client/features/blocks.js",
    "client/features/feed.js",
    "client/features/format.js",
    "client/features/pending.js",
    "client/features/commands.js",
    "client/features/slash.js",
    "client/features/chips.js",
    "client/features/setup.js",
    "client/utils/ui.js",
    "client/utils/motion.js",
    "client/kvist-mark.svg",
    "client/fonts/JetBrainsMono.woff2",
    "client/fonts/OFL.txt",
]
"kernel.prompts.system" = ["*.txt"]
"kernel.prompts.styles" = ["*.txt"]
"kernel.prompts.styles.agents" = ["*.txt"]
"kernel.prompts.styles.chat" = ["*.txt"]
"kernel.themes" = ["*.json"]
"frontends.tui.classic.assets" = ["*.png"]
"frontends.tui.ink.dist-ui" = ["*.mjs", "*.mp4"]
