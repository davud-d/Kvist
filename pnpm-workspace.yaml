# Marks this directory as its own pnpm workspace root. Kvist doesn't use
# pnpm workspaces itself (every app under frontends/ is a plain npm
# package), but without this marker `pnpm --workspace-root` walks up past
# Kvist and lands on an unrelated pnpm monorepo higher in the directory
# tree, which breaks electron-builder's Node module collector when it
# shells out to pnpm during `dist:app`.
packages: []
