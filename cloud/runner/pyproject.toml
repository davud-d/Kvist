[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kvist-runner"
version = "0.1.0"
description = "Kvist Cloud runner: the process on a customer machine that runs Kvist tasks."
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["websockets>=13", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
kvist-runner = "kvist_runner.__main__:main"

[tool.setuptools.packages.find]
include = ["kvist_runner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP009"]
