# Kvist Cloud behind Cloudflare, on a host whose nginx already serves another site with a Cloudflare Origin
# certificate (see kvist-cloud.conf for the plain certbot variant). Replace cloud.example.org, and the two
# certificate paths if yours differ. The app listens on 127.0.0.1:8740 only.
#
# Assumes the host's nginx already has, from the other site: a catch-all default_server that refuses unknown
# names, `set_real_ip_from` for Cloudflare's ranges, and the `$kvist_from_cloudflare` geo variable (1 only when the
# TCP peer is Cloudflare). Both ports are listened on because an Origin Rule may still send traffic to 8443.
#
# Limit: Cloudflare cuts a request body at 100 MB on the free plan, so a runner's workspace export (up to 160 GB)
# cannot pass through the proxy. Everything else, WebSockets included, works.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen 8443 ssl;
    # No http2 here: a WebSocket handshake needs HTTP/1.1 between Cloudflare and this server.
    server_name cloud.example.org;

    ssl_certificate     /etc/ssl/kvist/origin-cf.pem;
    ssl_certificate_key /etc/ssl/kvist/origin-cf.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Keyed on $realip_remote_addr: real_ip rewrites $remote_addr to the visitor.
    if ($kvist_from_cloudflare = 0) { return 444; }

    # The app sets its own Content-Security-Policy; the transport rule belongs here.
    add_header Strict-Transport-Security "max-age=31536000" always;

    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8740;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Task streams and the runners' sockets stay open for hours; their heartbeat keeps them alive.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Events and screen frames must reach the browser as they come.
        proxy_buffering off;
        client_max_body_size 1m;
    }

    # Streamed, not spooled, for when the proxy is not in the way (see the limit above).
    location ~ ^/gateway/exports/ {
        proxy_pass http://127.0.0.1:8740;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
