# Kvist Cloud behind nginx. Replace cloud.example.org with the real name and issue the certificate
# (certbot --nginx, or your own). The app listens on 127.0.0.1:8740 only.
#
# If a CDN such as Cloudflare sits in front, add `set_real_ip_from <its ranges>; real_ip_header CF-Connecting-IP;`
# in the http block; the app itself does not use client addresses.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name cloud.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cloud.example.org;

    ssl_certificate     /etc/letsencrypt/live/cloud.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # The app sets its own Content-Security-Policy; the transport rule belongs here.
    add_header Strict-Transport-Security "max-age=31536000" always;

    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8740;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Task streams and the runners' sockets stay open for hours; their heartbeat keeps them alive.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Events and screen frames must reach the browser as they come.
        proxy_buffering off;
        client_max_body_size 1m;
    }

    # A runner uploads a workspace archive here, up to 160 GB (exports.MAX_ARCHIVE_BYTES): stream it, do not spool it.
    location ~ ^/gateway/exports/ {
        proxy_pass http://127.0.0.1:8740;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
