// Kvist for Firefox-family browsers (the first line of an autoconfig file is skipped).
// Copy this file into the browser's install folder and autoconfig.js into its defaults/pref/;
// delete both to undo. Nothing here runs until the browser starts.

// 1. The Kvist browser bridge, from ~/.kvist/browser-bridge (kvist --browser-bridge install).
// It lets Kvist work in this browser without remote debugging, which would tell every site
// navigator.webdriver = true. Without the installed files this does nothing.
try {
  const folder = Services.dirsvc.get("Home", Ci.nsIFile);
  folder.append(".kvist");
  folder.append("browser-bridge");
  const main = folder.clone();
  main.append("bridge.js");
  const frame = folder.clone();
  frame.append("bridge-frame.js");
  if (main.exists() && frame.exists()) {
    const { NetUtil } = ChromeUtils.importESModule("resource://gre/modules/NetUtil.sys.mjs");
    const stream = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
    stream.init(frame, -1, 0, 0);
    const source = NetUtil.readInputStreamToString(stream, stream.available(), { charset: "UTF-8" });
    stream.close();
    Services.scriptloader.loadSubScriptWithOptions(Services.io.newFileURI(main).spec,
      { target: { FRAME_SOURCE: source }, ignoreCache: true });
  }
} catch (error) {
  Cu.reportError(`Kvist browser bridge did not start: ${error}`);
}

// 2. Only for remote debugging (--remote-debugging-port): Firefox up to 140 (and Waterfox 6.6)
// breaks WebDriver BiDi as soon as one tab was restored but never opened, or unloaded to save
// memory; every command that visits all tabs fails on it. They all take the tabs from
// TabManager.browsers, so tabs without a page are left out there until they are opened.
try {
  const { TabManager } = ChromeUtils.importESModule("chrome://remote/content/shared/TabManager.sys.mjs");
  const all = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(TabManager), "browsers").get;
  Object.defineProperty(TabManager, "browsers", {
    configurable: true,
    get() {
      return all.call(this).filter(browser => browser.browsingContext);
    },
  });
} catch (error) {
  Cu.reportError(`Kvist remote debugging fix not applied: ${error}`);
}
