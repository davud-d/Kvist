// Kvist browser fix (the first line of an autoconfig file is skipped).
//
// Firefox up to 140 (and Waterfox 6.6, built on it) breaks WebDriver BiDi as soon as one
// tab was restored but never opened, or was unloaded to save memory: such a tab has no
// browsing context, and every command that visits all tabs (the tab list, preload scripts,
// event subscriptions, ending a session) fails on it. All of them take the tabs from
// TabManager.browsers, so the tabs without a page are left out there. They come back as
// soon as they are opened. Remove this file and autoconfig.js to undo.
try {
  const { TabManager } = ChromeUtils.importESModule("chrome://remote/content/shared/TabManager.sys.mjs");
  const all = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(TabManager), "browsers").get;
  Object.defineProperty(TabManager, "browsers", {
    configurable: true,
    get() {
      return all.call(this).filter(browser => browser.browsingContext);
    },
  });
} catch (error) {
  Cu.reportError(`Kvist browser fix not applied: ${error}`);
}
