name: Platforms

# Manual cross-platform check on the three systems Kvist ships for. ci.yml stays
# the fast per-push gate; this one also runs the slow real-PTY tests, the Ink UI
# and the packaged artifacts (wheel, PyInstaller binary).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  python:
    name: Python tests on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # A clean server image: no Bubblewrap, so the default sandbox mode
          # refuses arbitrary-code commands.
          - label: ubuntu-22.04 (bare server)
            os: ubuntu-22.04
            python-version: "3.11"
            bubblewrap: false
          - label: ubuntu-22.04 (with Bubblewrap)
            os: ubuntu-22.04
            python-version: "3.11"
            bubblewrap: true
          - label: macos-latest
            os: macos-latest
            python-version: "3.12"
            bubblewrap: false
          - label: windows-latest
            os: windows-latest
            python-version: "3.12"
            bubblewrap: false

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Bubblewrap
        if: matrix.bubblewrap
        run: sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Run offline test suite
        run: python -m pytest -ra

      # A separate step so a slow-test failure never hides the default suite's
      # result, and the default suite's failure never skips this one.
      - name: Run slow real-process and PTY tests
        if: ${{ !cancelled() }}
        run: python -m pytest -m slow -ra

  ink:
    name: Ink terminal UI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    defaults:
      run:
        working-directory: frontends/tui/ink

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontends/tui/ink/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: Wheel and binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontends/tui/ink/package-lock.json

      - name: Build the Ink terminal UI
        working-directory: frontends/tui/ink
        run: npm ci && npm run build

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build tools and dependencies
        run: python -m pip install --disable-pip-version-check build -r requirements-dev.txt

      # The wheel must carry every data file the code reads relative to __file__.
      - name: Build the wheel and install it into a fresh venv
        run: |
          rm -rf dist
          python -m build --wheel --outdir dist
          python -m venv "$RUNNER_TEMP/wheel-venv"
          venv_bin="$RUNNER_TEMP/wheel-venv/bin"
          [ -d "$venv_bin" ] || venv_bin="$RUNNER_TEMP/wheel-venv/Scripts"
          "$venv_bin/pip" install --disable-pip-version-check dist/*.whl
          cd "$RUNNER_TEMP" && "$venv_bin/kvist" --version

      - name: Build the PyInstaller binary and run it
        run: |
          python -m PyInstaller kvist.spec --noconfirm
          ./dist/kvist --version
