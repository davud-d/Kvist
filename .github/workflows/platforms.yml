name: Platforms

# Cross-platform check on the systems Kvist ships for, after every push (and on
# demand). It runs next to ci.yml and plugin-release.yml, which are separate
# workflows and run in parallel. Besides the tests it covers the slow real-PTY
# tests, the Ink UI, the packaged artifacts (wheel, PyInstaller binary), the
# agent tools against a fake provider and the CLI installer.
# macOS counts ten times a Linux minute on a private repository, so it joins
# manual runs and every tenth run only; the other runs cover Linux and Windows
# (about 46 billed minutes; a run with macOS is about 136).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    outputs:
      os: ${{ steps.plan.outputs.os }}
      python: ${{ steps.plan.outputs.python }}
    steps:
      # run_number counts every run of this workflow, so macOS joins about one
      # push in ten, and every manual run.
      - name: Choose the systems
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os

          macos = os.environ["EVENT"] == "workflow_dispatch" or int(os.environ["RUN_NUMBER"]) % 10 == 0
          systems = ["ubuntu-22.04", "windows-latest"] + (["macos-latest"] if macos else [])
          python_legs = [
              # A clean server image: no Bubblewrap, so the default sandbox mode
              # refuses arbitrary-code commands.
              {"label": "ubuntu-22.04 (bare server)", "os": "ubuntu-22.04", "python-version": "3.11", "bubblewrap": False},
              {"label": "ubuntu-22.04 (with Bubblewrap)", "os": "ubuntu-22.04", "python-version": "3.12", "bubblewrap": True},
              {"label": "macos-latest", "os": "macos-latest", "python-version": "3.12", "bubblewrap": False},
              {"label": "windows-latest", "os": "windows-latest", "python-version": "3.12", "bubblewrap": False},
          ]
          print("os=" + json.dumps(systems))
          print("python=" + json.dumps([leg for leg in python_legs if leg["os"] in systems]))
          PY

  python:
    name: Python tests on ${{ matrix.label }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.python) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Bubblewrap
        if: matrix.bubblewrap
        run: sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run offline test suite
        run: python -m pytest -ra

      # A separate step so a slow-test failure never hides the default suite's
      # result, and the default suite's failure never skips this one.
      - name: Run slow real-process and PTY tests
        if: ${{ !cancelled() }}
        run: python -m pytest -m slow -ra

  ink:
    name: Ink terminal UI on ${{ matrix.os }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}

    defaults:
      run:
        working-directory: frontends/tui/ink

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontends/tui/ink/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: Wheel and binary on ${{ matrix.os }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontends/tui/ink/package-lock.json

      - name: Build the Ink terminal UI
        working-directory: frontends/tui/ink
        run: npm ci && npm run build

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build tools and dependencies
        run: python -m pip install --disable-pip-version-check build -r requirements-dev.txt

      # The wheel must carry every data file the code reads relative to __file__.
      - name: Build the wheel and install it into a fresh venv
        run: |
          rm -rf dist
          python -m build --wheel --outdir dist
          python -m venv "$RUNNER_TEMP/wheel-venv"
          venv_bin="$RUNNER_TEMP/wheel-venv/bin"
          [ -d "$venv_bin" ] || venv_bin="$RUNNER_TEMP/wheel-venv/Scripts"
          "$venv_bin/pip" install --disable-pip-version-check dist/*.whl
          cd "$RUNNER_TEMP" && "$venv_bin/kvist" --version

      - name: Check the data files packaged into the wheel
        run: |
          python - <<'PY'
          import glob, zipfile

          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for part in ("prompts", "themes", "assets", "dist-ui"):
              assert any(part in name for name in names), f"the wheel carries no {part}"
          PY

      - name: Build the PyInstaller binary and run it
        run: |
          python -m PyInstaller kvist.spec --noconfirm
          ./dist/kvist --version

  agent-smoke:
    # The agent end to end: a fake provider on a local port answers with tool
    # calls (create a file, edit it, run a command) and the script checks the
    # workspace after each turn. Runs last, only when everything above passed.
    name: Agent tools smoke on ${{ matrix.os }}
    needs: [plan, python, ink, package]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # The first import of the installed packages is slow on a fresh runner
      # (macOS checks every new binary); it is not what the smoke test times.
      - name: Warm up the imports
        run: python -c "import kernel.main, tiktoken; tiktoken.encoding_for_model('gpt-4o')"

      - name: Run the agent tools smoke test
        run: python scripts/e2e_tools_smoke.py

  install-smoke:
    # The whole path of a user: the CLI installer builds and installs kvist
    # into a scratch home, then the installed launcher runs on a fake provider
    # (three file tools and one terminal command). Only the CLI installer runs.
    name: Install smoke on ${{ matrix.os }}
    needs: [plan, python, ink, package, agent-smoke]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies for the fake-provider config
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install kvist and run it on a fake provider
        run: python scripts/e2e_install_smoke.py
