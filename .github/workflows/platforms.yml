name: Platforms

# Cross-platform check on the systems Kvist ships for, after every push (and on
# demand). It runs next to ci.yml and plugin-release.yml, which are separate
# workflows and run in parallel. Besides the tests it covers the slow real-PTY
# tests, the Ink UI, the packaged artifacts (wheel, PyInstaller binary), the
# agent tools against a fake provider and the CLI installer.
# macOS counts ten times a Linux minute on a private repository, so it joins
# manual runs and every tenth run only (the experimental BSD job runs every time); the other runs cover Linux and Windows
# (about 46 billed minutes; a run with macOS is about 136).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    outputs:
      os: ${{ steps.plan.outputs.os }}
      python: ${{ steps.plan.outputs.python }}
    steps:
      - name: Choose the systems
        id: plan
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json

          systems = ["ubuntu-22.04", "windows-latest", "macos-latest"]
          python_legs = [
              # A clean server image: no Bubblewrap, so the default sandbox mode
              # refuses arbitrary-code commands.
              {"label": "ubuntu-22.04 (bare server)", "os": "ubuntu-22.04", "python-version": "3.11", "bubblewrap": False},
              {"label": "ubuntu-22.04 (with Bubblewrap)", "os": "ubuntu-22.04", "python-version": "3.12", "bubblewrap": True},
              {"label": "macos-latest", "os": "macos-latest", "python-version": "3.12", "bubblewrap": False},
              {"label": "windows-latest", "os": "windows-latest", "python-version": "3.12", "bubblewrap": False},
          ]
          print("os=" + json.dumps(systems))
          print("python=" + json.dumps([leg for leg in python_legs if leg["os"] in systems]))
          PY

  python:
    name: Python tests on ${{ matrix.label }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.python) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Bubblewrap
        if: matrix.bubblewrap
        run: sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run offline test suite
        run: python -m pytest -ra

      # A separate step so a slow-test failure never hides the default suite's
      # result, and the default suite's failure never skips this one.
      - name: Run slow real-process and PTY tests
        if: ${{ !cancelled() }}
        run: python -m pytest -m slow -ra

  ink:
    name: Ink terminal UI on ${{ matrix.os }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}

    defaults:
      run:
        working-directory: frontends/tui/ink

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontends/tui/ink/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The OpenCode-style interface runs on Bun (OpenTUI's native renderer), straight from
  # source: there is nothing to build. Linux only; its tests use Node for the scripted core.
  opencode:
    name: OpenCode-style terminal UI on Bun
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontends/tui/opencode

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test --timeout 30000

  # FreeBSD, OpenBSD and NetBSD have no hosted runners: the action boots each system in QEMU on
  # an Ubuntu runner and runs the script inside it. Experimental: the core has no sandbox there
  # (no Bubblewrap, no cgroups), so only the credential-free smoke subset runs, and a failure
  # never fails the workflow (continue-on-error). Native dependencies (cryptography, Pillow,
  # pydantic-core, tiktoken, jiter) have no BSD wheels, so they come from the system's own
  # packages; the names were checked against each system's package index. NetBSD has no
  # tiktoken/jiter package, so pip builds those two with Rust. The images ship `sudo` without a
  # password (also OpenBSD's) and `bash`.
  bsd:
    name: Python smoke on ${{ matrix.name }} ${{ matrix.version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: freebsd
            version: "15.1"
            python: python3.12
            install: >-
              sudo pkg install -y python312 py312-pip py312-sqlite3 py312-pillow
              py312-cryptography py312-pydantic2 py312-pydantic-core py312-tiktoken py312-jiter
              py312-keyring py312-paramiko git ripgrep
          - name: openbsd
            version: "8.0"
            python: python3.14
            install: >-
              sudo pkg_add python py3-pip py3-Pillow py3-cryptography py3-pydantic
              py3-pydantic-core py3-tiktoken py3-jiter py3-keyring py3-paramiko git ripgrep
          - name: netbsd
            version: "11.0"
            python: python3.12
            install: >-
              sudo pkgin -y install python312 py312-pip py312-Pillow py312-cryptography
              py312-pydantic py312-pydantic-core py312-keyring py312-paramiko git-base ripgrep rust

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run the smoke tests inside ${{ matrix.name }}
        uses: cross-platform-actions/action@82668f1fbd89d9c99487604f822cbf6716f124d3 # v1.7.0
        with:
          operating_system: ${{ matrix.name }}
          version: ${{ matrix.version }}
          shell: bash
          run: |
            set -euo pipefail
            ${{ matrix.install }}
            ${{ matrix.python }} -m venv --system-site-packages .venv
            # requirements-dev.txt is not used: ruff and pyinstaller have no BSD builds.
            .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt "pytest>=8.3,<10" defusedxml==0.7.1
            .venv/bin/python -m pytest -ra -m offline_smoke

  package:
    name: Wheel and binary on ${{ matrix.os }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontends/tui/ink/package-lock.json

      - name: Build the Ink terminal UI
        working-directory: frontends/tui/ink
        run: npm ci && npm run build

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build tools and dependencies
        run: python -m pip install --disable-pip-version-check build -r requirements-dev.txt

      # The wheel must carry every data file the code reads relative to __file__.
      - name: Build the wheel and install it into a fresh venv
        run: |
          rm -rf dist
          python -m build --wheel --outdir dist
          python -m venv "$RUNNER_TEMP/wheel-venv"
          venv_bin="$RUNNER_TEMP/wheel-venv/bin"
          [ -d "$venv_bin" ] || venv_bin="$RUNNER_TEMP/wheel-venv/Scripts"
          "$venv_bin/pip" install --disable-pip-version-check dist/*.whl
          cd "$RUNNER_TEMP" && "$venv_bin/kvist" --version
          cd "$RUNNER_TEMP" && "$venv_bin/kvist-web" --help
          "$venv_bin/python" - <<'PY'
          from kvist_web.http_api import client_root

          root = client_root()
          for path in ("index.html", "app.js", "styles.css", "utils/api.js"):
              assert (root / path).is_file(), path
          PY

      - name: Check the data files packaged into the wheel
        run: |
          python - <<'PY'
          import glob, zipfile

          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for part in ("prompts", "themes", "assets", "dist-ui", "kvist_web/client/index.html"):
              assert any(part in name for name in names), f"the wheel carries no {part}"
          PY

      - name: Build the PyInstaller binary and run it
        run: |
          python -m PyInstaller kvist.spec --noconfirm
          ./dist/kvist --version
          ./dist/kvist --web-controller --help

      # The macOS layout of the VS Code extension: the binary goes into bin/mac-<cpu>/ and
      # must run from there and end up in the VSIX. Mac runners only, so it costs little.
      - name: Package the VS Code extension with the macOS binary
        if: runner.os == 'macOS'
        working-directory: frontends/ide/vscode
        run: |
          set -euo pipefail
          case "$(uname -m)" in arm64) arch=arm64 ;; *) arch=x64 ;; esac
          mkdir -p "bin/mac-$arch"
          cp ../../../dist/kvist "bin/mac-$arch/kvist.bin"
          chmod +x "bin/mac-$arch/kvist.bin"
          "bin/mac-$arch/kvist.bin" --version
          npm ci
          npm run build
          npx --no-install vsce package --no-dependencies --skip-license --out "$RUNNER_TEMP/kvist.vsix"
          python3 - "$RUNNER_TEMP/kvist.vsix" "$arch" <<'PY'
          import sys, zipfile

          entry = f"extension/bin/mac-{sys.argv[2]}/kvist.bin"
          assert entry in zipfile.ZipFile(sys.argv[1]).namelist(), f"{entry} is not in the VSIX"
          PY

      # Runs the release installer under the system bash 3.2 of macOS, with stand-in assets.
      - name: Run the release installer on macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          case "$(uname -m)" in arm64) asset=kvist-macos-arm64 ;; *) asset=kvist-macos-x64 ;; esac
          assets="$RUNNER_TEMP/assets"
          mkdir -p "$assets" "$RUNNER_TEMP/zip/kvist-intellij/lib" "$HOME/Library/Application Support/JetBrains/PyCharm2025.3"
          printf '#!/bin/sh\necho kvist-core "$@"\n' > "$assets/$asset"
          echo stand-in > "$RUNNER_TEMP/zip/kvist-intellij/lib/kvist.jar"
          (cd "$RUNNER_TEMP/zip" && zip -qr "$assets/kvist-jetbrains.zip" kvist-intellij)
          echo stand-in > "$assets/kvist-vscode.vsix"
          /bin/bash scripts/release/install.sh --from "$assets"
          test "$("$HOME/.local/bin/kvist")" = "kvist-core --workspace $PWD"
          test -f "$HOME/Library/Application Support/JetBrains/PyCharm2025.3/plugins/kvist-intellij/lib/kvist.jar"

  agent-smoke:
    # The agent end to end: a fake provider on a local port answers with tool
    # calls (create a file, edit it, run a command) and the script checks the
    # workspace after each turn. Runs last, only when everything above passed.
    name: Agent tools smoke on ${{ matrix.os }}
    needs: [plan, python, ink, package]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # The first import of the installed packages is slow on a fresh runner
      # (macOS checks every new binary); it is not what the smoke test times.
      - name: Warm up the imports
        run: python -c "import kernel.main, tiktoken; tiktoken.encoding_for_model('gpt-4o')"

      - name: Run the agent tools smoke test
        run: python scripts/e2e_tools_smoke.py

  install-smoke:
    # The whole path of a user: the CLI installer builds and installs kvist
    # into a scratch home, then the installed launcher runs on a fake provider
    # (three file tools and one terminal command). Only the CLI installer runs.
    name: Install smoke on ${{ matrix.os }}
    needs: [plan, python, ink, package, agent-smoke]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies for the fake-provider config
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install kvist and run it on a fake provider
        run: python scripts/e2e_install_smoke.py
