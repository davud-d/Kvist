name: Cloud Mobile

# Tests only the Kvist Cloud phone app and the payments behind it, nothing else in the repository:
#   - the server's side of paying with Apple Pay and Google Pay (Stripe's contract fake), and the /m page's headers;
#   - the page itself: unit tests, then a real Chromium (Android profile) and WebKit (iPhone profile) driving a real
#     cloud server, runner and the scripted Kvist, with the phone apps' bridge stood in for;
#   - the Android app: unit tests, a debug build, and the manifest's security settings;
#   - the iOS app: the Swift core on Linux, then the app itself built for the simulator.
# The real wallet sheets (Google Pay, Apple Pay) need a device, an account and a merchant: see frontends/cloud-android and
# frontends/cloud-ios README for the manual check that remains.
on:
  push:
    paths:
      - "cloud/mobile/**"
      - "cloud/frontend/build.mjs"
      - "cloud/backend/kvist_cloud/wallet.py"
      - "cloud/backend/kvist_cloud/billing.py"
      - "cloud/backend/kvist_cloud/web.py"
      - "cloud/backend/kvist_cloud/config.py"
      - "cloud/backend/tests/test_wallet.py"
      - "cloud/backend/tests/test_mobile.py"
      - "cloud/backend/tests/stripe_fake.py"
      - "frontends/cloud-android/**"
      - "frontends/cloud-ios/**"
      - ".github/workflows/cloud-mobile.yml"
  pull_request:
    paths:
      - "cloud/mobile/**"
      - "cloud/frontend/build.mjs"
      - "cloud/backend/kvist_cloud/wallet.py"
      - "cloud/backend/kvist_cloud/billing.py"
      - "cloud/backend/kvist_cloud/web.py"
      - "cloud/backend/kvist_cloud/config.py"
      - "cloud/backend/tests/test_wallet.py"
      - "cloud/backend/tests/test_mobile.py"
      - "cloud/backend/tests/stripe_fake.py"
      - "frontends/cloud-android/**"
      - "frontends/cloud-ios/**"
      - ".github/workflows/cloud-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Payments and the /m page (server)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the cloud server
        run: python -m pip install --disable-pip-version-check -e "cloud/backend[dev]" -e "cloud/runner[dev]"

      - name: Lint
        run: python -m ruff check cloud/backend/kvist_cloud/wallet.py cloud/backend/kvist_cloud/web.py cloud/backend/tests/test_wallet.py cloud/backend/tests/test_mobile.py cloud/backend/tests/stripe_fake.py cloud/mobile/tests/server.py

      # Billing and the web tests ride along: wallet purchases share the checkout table, fulfilment and the sweep with Platega's.
      - name: Wallet, billing and page tests
        working-directory: cloud/backend
        run: python -m pytest tests/test_wallet.py tests/test_mobile.py tests/test_billing.py tests/test_web.py tests/test_security_web.py tests/test_security_billing.py -q

  web-unit:
    name: The page (unit tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Unit tests
        working-directory: cloud/mobile
        run: npm ci --no-audit --no-fund && npm test

  web-browser:
    name: The page in Chromium and WebKit
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install the cloud server and its runner
        run: python -m pip install --disable-pip-version-check -e "cloud/backend[dev]" -e "cloud/runner[dev]"

      - name: Build the cloud's frontend (it carries the page)
        working-directory: cloud/frontend
        run: npm ci --no-audit --no-fund && node build.mjs

      - name: Install Playwright and its browsers
        working-directory: cloud/mobile
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium webkit

      # Every scenario starts its own server, so they cannot lean on each other's data.
      - name: Scenarios (Android profile in Chromium, iPhone profile in WebKit)
        working-directory: cloud/mobile
        env:
          PYTHON: python
          WEBKIT: "1"
          SHOTS: ${{ runner.temp }}/shots
        run: node tests/browser/run.mjs

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloud-mobile-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android app
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK platform 36
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Unit tests and debug APK
        working-directory: frontends/cloud-android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      # A product build must refuse plain HTTP; only a build pointed at a test server on this network may allow it.
      - name: The product build forbids cleartext traffic
        working-directory: frontends/cloud-android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean :app:processDebugManifest
          manifest=app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' "$manifest"
          grep -q 'com.google.android.gms.wallet.api.enabled' "$manifest"

      - name: A test build points at a server on this network and allows plain HTTP
        working-directory: frontends/cloud-android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean :app:processDebugManifest -PkvistCloudUrl=http://10.0.2.2:8742
          manifest=app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="true"' "$manifest"

  ios-core:
    name: Swift core (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container: swift:6.0-jammy
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: swift test
        working-directory: frontends/cloud-ios
        run: swift test

  ios-app:
    name: iPhone app (simulator build)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Core tests
        working-directory: frontends/cloud-ios
        run: swift test

      # The Apple Pay entitlement needs a signed build, which CI does not have (no certificate is kept here): this builds the
      # app unsigned for the simulator, which proves that it compiles against PassKit and WebKit and that the project is whole.
      - name: Build for the simulator
        working-directory: frontends/cloud-ios
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project KvistCloud.xcodeproj -scheme KvistCloud -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          app=$(find build/Build/Products -name '*.app' -maxdepth 3 | head -1)
          test -n "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :KvistCloudURL' "$app/Info.plist")" = "https://cloud.kvist.site"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = "site.kvist.cloud"
