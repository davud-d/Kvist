name: Plugin release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cleanup-artifacts:
    name: Free stale artifact storage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Delete artifacts from previous runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids="$(gh api "repos/${{ github.repository }}/actions/artifacts" --paginate -q '.artifacts[].id')"
          for id in $ids; do
            echo "Deleting artifact $id"
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

  build-windows-binary:
    name: Build Windows binary
    needs: cleanup-artifacts
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Build binary with PyInstaller
        run: python -m PyInstaller kvist.spec

      - name: Upload Windows binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-binary
          path: dist/kvist.exe
          if-no-files-found: error
          retention-days: 1

  build-plugin:
    name: Build IntelliJ plugin and publish
    needs: build-windows-binary
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Build Linux binary with PyInstaller
        run: python -m PyInstaller kvist.spec

      - name: Download Windows binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-binary
          path: frontends/ide/jetbrains/bin/win

      - name: Prepare binaries
        run: |
          set -euo pipefail
          mkdir -p frontends/ide/jetbrains/bin/linux
          mv dist/kvist frontends/ide/jetbrains/bin/linux/kvist.bin
          chmod +x frontends/ide/jetbrains/bin/linux/kvist.bin

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build plugin zip
        working-directory: frontends/ide/jetbrains
        run: |
          chmod +x gradlew
          ./gradlew clean buildPlugin

      - name: Publish/update rolling release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: latest-plugin-build
          name: "Latest plugin build (rolling, from main)"
          body: |
            Automatically rebuilt from `${{ github.sha }}` on every push to `main`.
            Install the attached `.zip` directly in the JetBrains IDE plugin manager.
          make_latest: true
          prerelease: false
          files: frontends/ide/jetbrains/build/distributions/*.zip
