name: Plugin release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cleanup-artifacts:
    name: Free stale artifact storage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Delete artifacts from previous runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids="$(gh api "repos/${{ github.repository }}/actions/artifacts" --paginate -q '.artifacts[].id')"
          for id in $ids; do
            echo "Deleting artifact $id"
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

  plan:
    # macOS minutes count ten times on a private repository, so the macOS binaries are
    # rebuilt on manual runs and on every tenth run only. The other runs reuse the ones
    # the rolling release already holds (see "Prepare macOS binaries").
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      macos: ${{ steps.plan.outputs.macos }}
    steps:
      - name: Decide whether to build macOS
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ $((RUN_NUMBER % 10)) -eq 0 ]; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos=false" >> "$GITHUB_OUTPUT"
          fi

  build-macos-binary:
    name: Build macOS binary (${{ matrix.arch }})
    needs: [cleanup-artifacts, plan]
    if: needs.plan.outputs.macos == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Build binary with PyInstaller
        run: python -m PyInstaller kvist.spec

      - name: Upload macOS binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-binary-${{ matrix.arch }}
          path: dist/kvist
          if-no-files-found: error
          retention-days: 1

  build-windows-binary:
    name: Build Windows binary
    needs: cleanup-artifacts
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Build binary with PyInstaller
        run: python -m PyInstaller kvist.spec

      - name: Upload Windows binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-binary
          path: dist/kvist.exe
          if-no-files-found: error
          retention-days: 1

  build-plugin:
    name: Build IntelliJ plugin and publish
    needs: [build-windows-binary, build-macos-binary]
    # The macOS job is skipped on most runs, which would skip this one with it.
    if: ${{ !cancelled() && needs.build-windows-binary.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Build Linux binary with PyInstaller
        run: python -m PyInstaller kvist.spec

      - name: Download Windows binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-binary
          path: frontends/ide/jetbrains/bin/win

      - name: Prepare binaries
        run: |
          set -euo pipefail
          mkdir -p release frontends/ide/jetbrains/bin/linux frontends/ide/vscode/bin/linux frontends/ide/vscode/bin/win
          cp dist/kvist release/kvist-linux-x64
          cp frontends/ide/jetbrains/bin/win/kvist.exe release/kvist-windows-x64.exe
          cp frontends/ide/jetbrains/bin/win/kvist.exe frontends/ide/vscode/bin/win/kvist.exe
          mv dist/kvist frontends/ide/jetbrains/bin/linux/kvist.bin
          cp frontends/ide/jetbrains/bin/linux/kvist.bin frontends/ide/vscode/bin/linux/kvist.bin
          chmod +x release/kvist-linux-x64 frontends/ide/jetbrains/bin/linux/kvist.bin frontends/ide/vscode/bin/linux/kvist.bin

      - name: Download the fresh macOS binaries
        if: needs.build-macos-binary.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: macos-binary-*
          path: macos-fresh

      - name: Prepare macOS binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            target="release/kvist-macos-$arch"
            fresh="macos-fresh/macos-binary-$arch/kvist"
            if [ -f "$fresh" ]; then
              cp "$fresh" "$target"
            else
              # Not rebuilt on this run: take the binary the rolling release already holds.
              gh release download latest-plugin-build --repo "$GITHUB_REPOSITORY" --pattern "kvist-macos-$arch" --dir release --clobber || true
            fi
            [ -f "$target" ] || continue
            chmod +x "$target"
            for plugin in jetbrains vscode; do
              mkdir -p "frontends/ide/$plugin/bin/mac-$arch"
              cp "$target" "frontends/ide/$plugin/bin/mac-$arch/kvist.bin"
            done
          done
          ls -l release

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build plugin zip
        working-directory: frontends/ide/jetbrains
        run: |
          chmod +x gradlew
          ./gradlew clean buildPlugin

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontends/ide/vscode/package-lock.json

      - name: Build VS Code extension (one VSIX with both binaries)
        working-directory: frontends/ide/vscode
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npx --no-install vsce package --no-dependencies --skip-license --out "../../../release/kvist-vscode.vsix"

      - name: Collect release assets
        run: |
          set -euo pipefail
          cp frontends/ide/jetbrains/build/distributions/*.zip release/kvist-jetbrains.zip
          cp scripts/release/install.sh scripts/release/install.ps1 release/
          chmod +x release/install.sh
          ls -l release
          # The macOS binaries are listed only when they exist: fail_on_unmatched_files stays on.
          {
            echo 'RELEASE_FILES<<END_OF_FILES'
            printf '%s\n' release/kvist-linux-x64 release/kvist-windows-x64.exe release/kvist-jetbrains.zip \
              release/kvist-vscode.vsix release/install.sh release/install.ps1
            ls release/kvist-macos-* 2>/dev/null || true
            echo 'END_OF_FILES'
          } >> "$GITHUB_ENV"

      - name: Publish/update rolling release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: latest-plugin-build
          name: "Latest build (rolling, from main)"
          body: |
            Automatically rebuilt from `${{ github.sha }}` on every push to `main`.

            **Install everything in one step** (the `kvist` command, the JetBrains plugin and the VS Code extension, into every IDE found):

            ```sh
            # Linux and macOS (macOS is best-effort, see below)
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/latest-plugin-build/install.sh | bash
            ```

            ```powershell
            # Windows
            irm https://github.com/${{ github.repository }}/releases/download/latest-plugin-build/install.ps1 | iex
            ```

            | Asset | What it is |
            | --- | --- |
            | `install.sh`, `install.ps1` | Download the assets below and put them where they belong. |
            | `kvist-linux-x64`, `kvist-windows-x64.exe` | The standalone agent binary. |
            | `kvist-macos-arm64`, `kvist-macos-x64` | The standalone agent binary for macOS (Apple Silicon, Intel). Best-effort and not verified on a Mac. Rebuilt on every tenth build, so it can lag behind `main`. |
            | `kvist-jetbrains.zip` | JetBrains plugin (also installable from the IDE plugin manager). |
            | `kvist-vscode.vsix` | VS Code / Insiders / VSCodium extension. |
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ env.RELEASE_FILES }}
