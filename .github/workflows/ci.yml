name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run offline test suite
        run: python -m pytest -ra

  wheel-install-smoke:
    name: Wheel install smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build the Ink terminal UI (dist-ui/kvist-tui.mjs)
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the build frontend
        run: python -m pip install --disable-pip-version-check build

      # The wheel must carry every data file the code reads by a path relative
      # to __file__ at runtime (prompts/, themes/, assets/, dist-ui/) — a
      # missing one fails silently until first use, sometimes as late as
      # `kvist --version` (see agent_planner.py's import-time prompt read).
      # This step catches a py-modules/package-data regression that
      # `pnpm run test`/`pytest` never would, because both run against the
      # source tree, never the installed distribution.
      - name: Build the wheel
        run: rm -rf dist && python -m build --wheel --outdir dist

      - name: Install the wheel into a fresh venv
        run: |
          set -euo pipefail
          python -m venv /tmp/kvist-wheel-venv
          /tmp/kvist-wheel-venv/bin/pip install --disable-pip-version-check dist/*.whl

      - name: Run kvist --version outside the repository
        working-directory: /tmp
        run: /tmp/kvist-wheel-venv/bin/kvist --version

      - name: List data files packaged into the wheel
        run: |
          set -euo pipefail
          whl="$(ls dist/*.whl)"
          echo "=== prompts/themes/assets/dist-ui entries in $whl ==="
          unzip -l "$whl" | grep -E "prompts|themes|assets|dist-ui"
