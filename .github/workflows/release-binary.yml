name: Release Binary

# One self-contained binary per system: the core, the terminal UI, the Node.js it runs on and the
# Rust session program, all packed by PyInstaller (kvist.spec). The curl / irm installer in
# scripts/release/binary downloads exactly this file and nothing else; the IDE plugins, the desktop
# app and the other interfaces stay in the Plugin release and are installed by hand.
#
# Every push, to any branch, builds and smoke-tests the binaries; only a push to main also publishes
# the rolling release `latest-binary-build`.
on:
  push:
  workflow_dispatch:

concurrency:
  group: release-binary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Binary for ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux binaries are built on 22.04: its glibc (2.35) is the floor they run on.
          - asset: kvist-linux-x64
            runner: ubuntu-22.04
            built: kvist
          - asset: kvist-linux-arm64
            runner: ubuntu-22.04-arm
            built: kvist
          - asset: kvist-macos-arm64
            runner: macos-latest
            built: kvist
          - asset: kvist-macos-x64
            runner: macos-15-intel
            built: kvist
          - asset: kvist-windows-x64.exe
            runner: windows-latest
            built: kvist.exe

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      # The Node.js that builds the terminal UI is the one packed into the binary to run it.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontends/tui/ink/package-lock.json

      - name: Build the terminal UI
        working-directory: frontends/tui/ink
        run: npm ci && npm run build

      - name: Build the Rust session program
        working-directory: kernel/session-rs
        run: cargo build --release --locked

      - name: Name the Node.js to pack
        run: echo "KVIST_BUNDLE_NODE=$(node -p process.execPath)" >> "$GITHUB_ENV"

      - name: Build the binary with PyInstaller
        run: python -m PyInstaller kvist.spec --noconfirm

      - name: Smoke-test the binary
        run: python scripts/release/binary/smoke.py "dist/${{ matrix.built }}"

      - name: Upload the binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.asset }}
          path: dist/${{ matrix.built }}
          if-no-files-found: error
          retention-days: 1

  # Published only when every system built: a release that lacks one platform would send that
  # platform's installer to a 404.
  publish:
    name: Publish the rolling release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: binary-*
          path: binaries

      - name: Collect the release assets
        run: |
          set -euo pipefail
          mkdir release
          for folder in binaries/binary-*; do
            cp "$folder"/kvist* "release/${folder#binaries/binary-}"
          done
          chmod +x release/kvist-linux-* release/kvist-macos-*
          cp scripts/release/binary/install.sh scripts/release/binary/install.ps1 release/
          chmod +x release/install.sh
          (cd release && sha256sum kvist-* > SHA256SUMS)
          ls -l release
          cat release/SHA256SUMS

      - name: Publish/update rolling release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: latest-binary-build
          name: "Single binary (rolling, from main)"
          body: |
            Rebuilt from `${{ github.sha }}` on every push to `main`.

            **One file, everything in it:** the agent core, the terminal interface, the Node.js it runs on and the native session program. The installer downloads this file, checks it against `SHA256SUMS`, puts it in place and opens the first-run setup. It needs no Python, no Node.js, no administrator rights and no system packages.

            ```sh
            # Linux (x64, arm64) and macOS (arm64, x64)
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/latest-binary-build/install.sh | bash
            ```

            ```powershell
            # Windows
            irm https://github.com/${{ github.repository }}/releases/download/latest-binary-build/install.ps1 | iex
            ```

            The IDE plugins, the desktop app and the other interfaces are not in this file: download them by hand from the [Plugin release](https://github.com/${{ github.repository }}/releases/tag/latest-plugin-build).

            | Asset | What it is |
            | --- | --- |
            | `install.sh`, `install.ps1` | Download the binary for this system and install it. |
            | `kvist-linux-x64`, `kvist-linux-arm64` | Linux. Needs glibc 2.35 or newer. |
            | `kvist-macos-arm64`, `kvist-macos-x64` | macOS (Apple Silicon, Intel). |
            | `kvist-windows-x64.exe` | Windows. |
            | `SHA256SUMS` | The checksums the installers verify. |
          make_latest: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release/kvist-linux-x64
            release/kvist-linux-arm64
            release/kvist-macos-arm64
            release/kvist-macos-x64
            release/kvist-windows-x64.exe
            release/install.sh
            release/install.ps1
            release/SHA256SUMS
